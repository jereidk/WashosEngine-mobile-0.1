name: Build

on:
  workflow_call:
    inputs:
      buildType:
        required: true
        type: string
        description: "Build type: debug or release"
      assetType:
        required: false
        type: string
        default: "ASTC"
        description: "Asset compression type"
      isOfficial:
        required: false
        type: boolean
        default: false
        description: "Official build flag"
    secrets:
      KEYSTORE_FILE:
        required: false
      KEYSTORE_INFO_FILE:
        required: false

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build Android
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r28

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib || true
          haxelib install lime --quiet || true
          haxelib install openfl 9.3.3 --quiet || true
          haxelib install flixel 5.6.0 --quiet || true
          haxelib install hxcpp --quiet || true
          haxelib install hxp --quiet || true
          haxelib install hscript-iris 1.1.3 --quiet || true
          haxelib install flxanimate --quiet || true
          haxelib install tjson 1.4.0 --quiet || true
          haxelib install hxvlc 2.0.1 --quiet --skip-dependencies || true
          haxelib install hxdiscord_rpc 1.2.4 --quiet --skip-dependencies || true
          haxelib install linc_luajit --quiet || true
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools --quiet --skip-dependencies || true
          haxelib run lime setup -y || true

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME || true
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME || true
          haxelib run lime config ANDROID_SETUP true || true

      - name: Extract keystore
        if: ${{ inputs.buildType == 'release' && inputs.isOfficial && github.repository_owner == 'jereidk' }}
        shell: bash
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_INFO_FILE: ${{ secrets.KEYSTORE_INFO_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 --decode > keystore/android/key.keystore
            echo "$KEYSTORE_INFO_FILE" | base64 --decode > keystore/android/keystore.json
          fi

      - name: Compile
        id: build
        shell: bash
        run: |
          BUILD_ARGS="android"
          
          if [ "${{ inputs.buildType }}" == "release" ]; then
            BUILD_ARGS="$BUILD_ARGS -final"
          else
            BUILD_ARGS="$BUILD_ARGS -debug"
          fi
          
          if [ "${{ inputs.isOfficial }}" == "true" ]; then
            BUILD_ARGS="$BUILD_ARGS -D officialBuild"
          fi
          
          haxelib run lime build $BUILD_ARGS -ONLY_ARM64 -D ${{ inputs.assetType }}

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.PROJECT_NAME }}-${{ inputs.buildType }}-${{ inputs.assetType }}
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error