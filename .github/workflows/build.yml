name: Build

on:
  workflow_dispatch:
    inputs:
      buildType:
        required: false
        type: choice
        default: "release"
        options:
          - debug
          - release
        description: "Build type: debug or release"
      assetType:
        required: false
        type: choice
        default: "ASTC"
        options:
          - ASTC
          - ATC
          - DXT
          - ETC1
        description: "Asset compression type"
      isOfficial:
        required: false
        type: boolean
        default: false
        description: "Official build (adds -D officialBuild)"
  workflow_call:
    inputs:
      buildType:
        required: true
        type: string
        description: "Build type: debug or release"
      assetType:
        required: false
        type: string
        default: "ASTC"
        description: "Asset compression type"
      isOfficial:
        required: false
        type: boolean
        default: false
        description: "Official build flag"
    secrets:
      KEYSTORE_FILE:
        required: false
      KEYSTORE_INFO_FILE:
        required: false

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build Android
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r28

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib || true
          
          # Limpiar TODAS las versiones anteriores
          haxelib remove lime --quiet 2>/dev/null || true
          haxelib remove openfl --quiet 2>/dev/null || true
          haxelib remove hxcpp --quiet 2>/dev/null || true
          haxelib remove flixel --quiet 2>/dev/null || true
          haxelib remove flixel-addons --quiet 2>/dev/null || true
          
          # Forzar instalación de versiones específicas
          haxelib install lime 9.3.0 || true
          haxelib install openfl 9.3.3 || true
          haxelib install hxcpp 4.3.140 || true
          haxelib install flixel 5.6.0 || true
          haxelib install flixel-addons 3.3.2 || true
          haxelib install hxp 1.3.0 || true
          haxelib install hscript-iris 1.1.3 || true
          haxelib install flxanimate || true
          haxelib install tjson 1.4.0 || true
          haxelib install hxvlc 2.0.1 --skip-dependencies || true
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git || true
          haxelib install extension-androidtools 2.2.2 || true
          
          # Verificar versión de lime
          haxelib list | grep lime
          
          haxelib run lime setup -y || true

      - name: Verify Lime Version
        run: |
          echo "=== Verificando versión de lime ==="
          haxelib run lime version || lime version || echo "Lime no encontrado"
          echo "=== Fin verificación ==="

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME || true
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME || true
          haxelib run lime config ANDROID_SETUP true || true

      - name: Extract keystore
        if: ${{ inputs.buildType == 'release' && inputs.isOfficial && github.repository_owner == 'jereidk' }}
        shell: bash
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_INFO_FILE: ${{ secrets.KEYSTORE_INFO_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 --decode > keystore/android/key.keystore
            echo "$KEYSTORE_INFO_FILE" | base64 --decode > keystore/android/keystore.json
          fi

      - name: Compile
        id: build
        shell: bash
        run: |
          BUILD_ARGS="android"
          
          if [ "${{ inputs.buildType }}" == "release" ]; then
            BUILD_ARGS="$BUILD_ARGS -final"
          else
            BUILD_ARGS="$BUILD_ARGS -debug"
          fi
          
          if [ "${{ inputs.isOfficial }}" == "true" ]; then
            BUILD_ARGS="$BUILD_ARGS -D officialBuild"
          fi
          
          haxelib run lime build $BUILD_ARGS -ONLY_ARM64 -D ${{ inputs.assetType }}

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.PROJECT_NAME }}-${{ inputs.buildType }}-${{ inputs.assetType }}
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error