name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: false
        type: string
        default: ""
      buildArgs:
        required: true
        type: string
      assetType:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.name == 'Android'
        uses: nttld/setup-ndk@main
        id: ndk
        with:
          ndk-version: r28

      - name: Install Dependencies
        shell: bash
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet || echo "hmm install completed with warnings"

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME || true
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME || true
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64 || true
          haxelib run lime config ANDROID_SETUP true || true

      - name: Compile
        shell: bash
        run: haxelib run lime build ${{ inputs.buildArgs }} -D ${{ inputs.assetType }}
        continue-on-error: true

      - name: Make IPA
        if: startsWith(inputs.name, 'iOS')
        shell: bash
        run: |
          brew install ldid || true
          if [ -d "export/release/ios/build/Release-iphoneos" ]; then
            cd export/release/ios/build/Release-iphoneos
            mkdir -p Payload
            mv *.app Payload/ 2>/dev/null || true
            zip -r ${{ env.PROJECT_NAME }}.ipa Payload 2>/dev/null || echo "IPA creation skipped"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.assetType }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
