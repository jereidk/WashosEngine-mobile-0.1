name: Android Build

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  get-commit-hash:
    name: Get Commit Hash
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.hash.outputs.COMMIT_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - id: hash
        run: |
          commit_hash=$(git rev-parse --short HEAD)
          echo "Latest commit hash: $commit_hash"
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  Android:
    name: Android
    needs: get-commit-hash
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r28

      - name: Install Dependencies
        run: |
          haxelib setup ~/haxelib || true
          haxelib remove lime --quiet 2>/dev/null || true
          haxelib remove openfl --quiet 2>/dev/null || true
          haxelib remove hxcpp --quiet 2>/dev/null || true
          haxelib remove flixel --quiet 2>/dev/null || true
          haxelib remove flixel-addons --quiet 2>/dev/null || true
          haxelib install lime 9.3.0 || true
          haxelib install openfl 9.3.3 || true
          haxelib install hxcpp 4.3.0 || true
          haxelib install flixel 5.6.0 || true
          haxelib install flixel-addons 3.3.2 || true
          haxelib install hxp 1.3.0 || true
          haxelib install hscript-iris 1.1.3 || true
          haxelib install flxanimate || true
          haxelib install tjson 1.4.0 || true
          haxelib install hxvlc 2.0.1 --skip-dependencies || true
          haxelib install linc_luajit || true
          haxelib install extension-androidtools 2.2.2 || true
          haxelib run lime setup -y || true

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME || true
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME || true
          haxelib run lime config ANDROID_SETUP true || true

      - name: Compile
        run: haxelib run lime build android -ONLY_ARM64 -D ASTC

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild-ASTC
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 5
          if-no-files-found: warn

  Releaser:
    needs: [get-commit-hash, Android]
    runs-on: ubuntu-latest
    if: success()
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: androidBuild-ASTC
          path: /home/runner/android
        continue-on-error: true

      - name: Check Artifacts
        run: |
          echo "=== Android Build ==="
          ls -la /home/runner/android/ 2>/dev/null || echo "No Android build"

      - name: Rename and Package
        run: |
          if [ -f "/home/runner/android/"*.apk ]; then
            cp /home/runner/android/*.apk /home/runner/${{ env.PROJECT_NAME }}-Android.apk
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/${{ env.PROJECT_NAME }}-Android.apk
        continue-on-error: true
