name: Mobile + Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/**
      - dev/**
  pull_request:
    branches:
      - main

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: WashosEngine

jobs:
  get-commit-hash:
    name: Get Commit Hash
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.hash.outputs.COMMIT_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - id: hash
        run: |
          commit_hash=$(git rev-parse --short HEAD)
          echo "Latest commit hash: $commit_hash"
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  Android:
    name: Android
    needs: get-commit-hash
    runs-on: macos-26
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r28

      - name: Install Dependencies
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet || echo "hmm install completed"

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME || true
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME || true
          haxelib run lime config ANDROID_SETUP true || true

      - name: Compile
        run: haxelib run lime build android -ONLY_ARM64 -D ASTC
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild-ASTC
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 5
          if-no-files-found: warn

  iOS:
    name: iOS
    needs: get-commit-hash
    runs-on: macos-15
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Dependencies
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet || echo "hmm install completed"

      - name: Build iOS
        run: haxelib run lime build ios -nosign -D ASTC
        continue-on-error: true

      - name: Make IPA
        run: |
          brew install ldid || true
          if [ -d "export/release/ios/build/Release-iphoneos" ]; then
            cd export/release/ios/build/Release-iphoneos
            mkdir -p Payload
            mv *.app Payload/ 2>/dev/null || true
            zip -r ${{ env.PROJECT_NAME }}.ipa Payload 2>/dev/null || echo "IPA skipped"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild-ASTC
          path: export/release/ios/build/*.ipa
          retention-days: 5
          if-no-files-found: warn

  iOS-Simulator:
    name: iOS Simulator
    needs: get-commit-hash
    runs-on: macos-15
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Dependencies
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet || echo "hmm install completed"

      - name: Build iOS Simulator
        run: haxelib run lime build ios -simulator -nosign -D ASTC
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSSimulatorBuild-ASTC
          path: export/release/ios/build/Release-iphonesimulator/*.ipa
          retention-days: 5
          if-no-files-found: warn

  Releaser:
    needs: [get-commit-hash, Android, iOS, iOS-Simulator]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: androidBuild-ASTC
          path: /home/runner/android
        continue-on-error: true

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild-ASTC
          path: /home/runner/ios
        continue-on-error: true

      - name: Check Artifacts
        run: |
          echo "=== Android Build ==="
          ls -la /home/runner/android/ 2>/dev/null || echo "No Android build"
          echo ""
          echo "=== iOS Build ==="
          ls -la /home/runner/ios/ 2>/dev/null || echo "No iOS build"

      - name: Rename and Package
        run: |
          if [ -f "/home/runner/android/"*.apk ]; then
            cp /home/runner/android/*.apk /home/runner/${{ env.PROJECT_NAME }}-Android.apk
          fi
          if [ -f "/home/runner/ios/"*.ipa ]; then
            cp /home/runner/ios/*.ipa /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/${{ env.PROJECT_NAME }}-Android.apk
            /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa
        continue-on-error: true
