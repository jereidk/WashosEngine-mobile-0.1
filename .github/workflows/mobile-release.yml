name: Mobile + Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/**
      - dev/**
  pull_request:
    branches:
      - main

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: WashosEngine

jobs:
  get-commit-hash:
    name: Get Commit Hash
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.hash.outputs.COMMIT_HASH }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - id: hash
        run: |
          commit_hash=$(git rev-parse --short HEAD)
          echo "Latest commit hash: $commit_hash"
          echo "COMMIT_HASH=$commit_hash" >> $GITHUB_OUTPUT

  Build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      assetType: ASTC
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: macos-26
            buildArgs: "android -ONLY_ARM64"
            artifactName: androidBuild
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-15
            buildArgs: "ios -nosign"
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
          - name: iOS Simulator
            os: macos-15
            buildArgs: "ios -simulator -nosign"
            artifactName: iOSSimulatorBuild
            artifactPath: "export/release/ios/build/Release-iphonesimulator/*.ipa"

  Releaser:
    needs: [get-commit-hash, Build]
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: androidBuild-ASTC
          path: /home/runner/android
        continue-on-error: true

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild-ASTC
          path: /home/runner/ios
        continue-on-error: true

      - name: Check Artifacts
        run: |
          echo "=== Android Build ==="
          ls -la /home/runner/android/ 2>/dev/null || echo "No Android build"
          echo ""
          echo "=== iOS Build ==="
          ls -la /home/runner/ios/ 2>/dev/null || echo "No iOS build"

      - name: Rename and Package
        run: |
          # Android
          if [ -f "/home/runner/android/"*.apk ]; then
            cp /home/runner/android/*.apk /home/runner/${{ env.PROJECT_NAME }}-Android.apk
          fi
          # iOS
          if [ -f "/home/runner/ios/"*.ipa ]; then
            cp /home/runner/ios/*.ipa /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/${{ env.PROJECT_NAME }}-Android.apk
            /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa
        continue-on-error: true