name: Android Build

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build (Android)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        shell: bash
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          # Install ShadowEngine lime first
          haxelib git lime https://github.com/ShadowEngineTeam/lime 543368c85c496d8b968d8295e528c76a06f8bdf9 --quiet
          # Install ShadowEngine openfl second (depends on lime)
          haxelib git openfl https://github.com/ShadowEngineTeam/openfl 5d33fb36dce7a82ed5782a60c0c24640b7f81591 --quiet
          # Install rest of dependencies via hmm
          haxelib run hmm install --quiet
          # NOW patch ALL lime haxelib.json files to be compatible with flixel version checks
          echo "=== Patching lime versions ==="
          find ~/.haxelib -name "haxelib.json" 2>/dev/null | xargs grep -l "lime" 2>/dev/null | while read f; do
            if grep -q '"version": "1"' "$f" 2>/dev/null; then
              echo "Patching $f"
              sed -i '' 's/"version": "1"/"version": "8.3.1"/' "$f"
            fi
          done
          # Also check project local haxelib
          if [ -d ".haxelib" ]; then
            find .haxelib -name "haxelib.json" 2>/dev/null | while read f; do
              if grep -q '"version": "1"' "$f" 2>/dev/null; then
                echo "Patching project $f"
                sed -i '' 's/"version": "1"/"version": "8.3.1"/' "$f"
              fi
            done
          fi
          echo "=== Lime version patching done ==="

      - name: Configure Android
        run: |
          echo "Checking lime version..."
          haxelib list lime
          cat ~/.haxelib/lime/haxelib.json 2>/dev/null | head -5 || echo "No haxelib.json found"
          cat .haxelib/lime/haxelib.json 2>/dev/null | head -5 || echo "No project haxelib.json found"
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: |
          haxelib run lime build android -final -D officialBuild

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
