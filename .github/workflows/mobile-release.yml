name: Android Build

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build (Android)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        shell: bash
        run: |
          # Setup haxelib properly
          haxelib setup ~/haxelib 2>/dev/null || true
          haxelib newrepo 2>/dev/null || true
          
          # Install hmm first
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: |
          # Set HAXELIB_PATH to include both local and global repos
          export HAXELIB_PATH="$(pwd)/.haxelib:$HOME/haxelib"
          echo "HAXELIB_PATH=$HAXELIB_PATH"
          
          # Verify libraries are found
          echo "=== Library Paths ==="
          find ~/haxelib -name "*.hx" -path "*grig*" 2>/dev/null | head -5
          find .haxelib -name "*.hx" -path "*grig*" 2>/dev/null | head -5
          
          # List all haxelibs
          echo "=== All Libraries ==="
          haxelib list

          haxelib run lime build android -final -D officialBuild -D ASTC

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
