name: Android Build

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: WashosEngine

jobs:
  build:
    name: Build (Android)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: ShadowEngineTeam/setup-haxe@main
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Libraries
        shell: bash
        run: |
          haxelib git hmm https://github.com/ShadowEngineTeam/hmm --skip-dependencies --quiet
          # Install ShadowEngine lime first
          haxelib git lime https://github.com/ShadowEngineTeam/lime 543368c85c496d8b968d8295e528c76a06f8bdf9 --quiet
          # Install ShadowEngine openfl second (depends on lime)
          haxelib git openfl https://github.com/ShadowEngineTeam/openfl 5d33fb36dce7a82ed5782a60c0c24640b7f81591 --quiet
          # Install rest of dependencies via hmm
          haxelib run hmm install --quiet
          
          # Create/update lime haxelib.json with correct version for flixel compatibility
          echo "Creating lime haxelib.json with version 8.3.1..."
          # Check where lime is installed
          echo "Checking lime installation..."
          ls -la ~/.haxelib/ 2>/dev/null || echo "~/.haxelib not found"
          ls -la ~/.local/share/haxelib/ 2>/dev/null || echo "~/.local/share/haxelib not found"
          ls -la .haxelib/ 2>/dev/null || echo ".haxelib not found"
          # Try to find and patch the lime haxelib.json
          for LIME_DIR in "$HOME/.haxelib/lime" "$HOME/.local/share/haxelib/lime" "/usr/local/lib/haxe/lib/lime" ".haxelib/lime"; do
            PARENT_DIR="$(dirname "$LIME_DIR")"
            if [ -d "$PARENT_DIR" ] || mkdir -p "$PARENT_DIR" 2>/dev/null; then
              mkdir -p "$LIME_DIR" 2>/dev/null
              printf '{"name":"lime","url":"https://github.com/openfl/lime","license":"MIT","tags":[],"description":"A foundational Haxe framework for cross-platform development","version":"8.3.1","releasenote":"Various bug fixes","contributors":["singmajesty","bowlerhat","Dimensionscape"],"classPath":"src"}\n' > "$LIME_DIR/haxelib.json"
              echo "=== Created $LIME_DIR/haxelib.json ==="
              cat "$LIME_DIR/haxelib.json"
              break
            fi
          done

      - name: Configure Android
        run: |
          echo "Checking lime version..."
          haxelib list lime
          for LIME_DIR in "$HOME/.haxelib/lime" "$HOME/.local/share/haxelib/lime" "/usr/local/lib/haxe/lib/lime"; do
            if [ -f "$LIME_DIR/haxelib.json" ]; then
              echo "Found lime haxelib.json at $LIME_DIR"
              head -5 "$LIME_DIR/haxelib.json"
              break
            fi
          done
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: |
          haxelib run lime build android -final -D officialBuild

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
