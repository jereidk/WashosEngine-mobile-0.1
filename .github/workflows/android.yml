name: Android Build

on:
  push:
    branches: [ main, master, develop, fix/android-build ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y \
            wget unzip curl git cmake ninja-build g++ python3 \
            openjdk-17-jdk-headless

      - name: Setup Android SDK
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Setup Android NDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-30" "build-tools;34.0.0"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Haxe
        run: |
          apt-get install -y haxe
          haxe --version

      - name: Install haxelibs
        run: |
          haxelib setup
          haxelib install lime 8.2.0
          haxelib install flixel 5.6.0
          haxelib install openfl 9.3.3
          haxelib install extension-androidtools
          haxelib install linc_luajit
          haxelib install hxcpp

      - name: Build Android
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_ROOT=/opt/android-sdk/ndk/26.1.10909125
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd /workspace/project/WashosEngine-mobile-0.1
          haxelib run lime setup android
          haxelib run lime build android -release

      - name: Create NDK strip symlink
        run: |
          ln -sf llvm-strip /opt/android-sdk/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip

      - name: Fix linc_luajit ARMv7
        run: |
          # Comment out ARMv7 library in linc_luajit to avoid linking issues with ARM64 build
          sed -i "s|<lib name='\${LINC_LUA_PATH}/lib/lua/lib/Android/libluajit-v7.a' if='HXCPP_ARMV7' />|<!-- <lib name='\${LINC_LUA_PATH}/lib/lua/lib/Android/libluajit-v7.a' if='HXCPP_ARMV7' /> -->|" ~/.haxelib/linc_luajit/linc/linc_lua.xml

      - name: Rebuild Android (after fixes)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_ROOT=/opt/android-sdk/ndk/26.1.10909125
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd /workspace/project/WashosEngine-mobile-0.1
          rm -rf export
          haxelib run lime build android -release

      - name: Fix APK generation issues
        run: |
          # Copy the compiled ARM64 library to the correct location
          mkdir -p /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/src/main/jniLibs/arm64-v8a/
          cp /workspace/project/WashosEngine-mobile-0.1/export/release/android/obj/libApplicationMain-v7.so \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/obj/libApplicationMain-64.so
          cp /workspace/project/WashosEngine-mobile-0.1/export/release/android/obj/libApplicationMain-64.so \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/src/main/jniLibs/arm64-v8a/libApplicationMain.so
          
          # Remove ARMv7 folder if exists
          rm -rf /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/src/main/jniLibs/armeabi-v7a
          rm -rf /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/src/main/jniLibs/armeabi
          
          # Fix AndroidManifest.xml
          sed -i 's|android:label="WashosEngine" if="lime &ge; 8.2.0"|android:label="WashosEngine"|' \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/src/main/AndroidManifest.xml
          
          # Update Gradle version for Java 17+
          sed -i 's|gradle-7.4.2-bin.zip|gradle-8.5-bin.zip|' \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/gradle/wrapper/gradle-wrapper.properties
          sed -i "s|classpath 'com.android.tools.build:gradle:7.3.1'|classpath 'com.android.tools.build:gradle:8.2.0'|" \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/build.gradle
          sed -i "s|gradleVersion = '7.4.2'|gradleVersion = '8.5'|" \
             /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/build.gradle
          
          # Add memory settings to gradle.properties
          echo "
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true" >> /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/gradle.properties

      - name: Build APK with Gradle
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export ANDROID_NDK_ROOT=/opt/android-sdk/ndk/26.1.10909125
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          cd /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WashosEngine-android-apk
          path: /workspace/project/WashosEngine-mobile-0.1/export/release/android/bin/app/build/outputs/apk/release/*.apk
